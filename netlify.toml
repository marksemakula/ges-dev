# Production now builds and serves the Nuxt SSR/SSG site in ges-nuxt/.
# (Previously: command="npm run build", publish="dist" -> the root Vite SPA.
#  To roll back, restore those two lines or `git revert` this commit, then push.)
#
# "base" tells Netlify to cd into ges-nuxt FIRST, install deps ONLY there,
# then run the build command. Without it Netlify also installs the root
# package.json deps (the old Vite SPA), which wastes memory and can crash.
[build]
  base = "ges-nuxt"
  command = "npm ci && npm run generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NUXT_TELEMETRY_DISABLED = "1"

# Institution sub-sites: true 301s at Netlify's edge (run before any file is
# served, so they take precedence over Nuxt's prerendered redirect stubs).
[[redirects]]
  from = "/institutions/sakghs-kawaala"
  to = "https://sakghs-kawaala.vercel.app/"
  status = 301
  force = true

